services:
  agent:
    build: .
    image: local/agent-one:haskell
    container_name: agent-one
    command: ["--a2a"]
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    env_file: .env
    environment:
      INSTRUCTIONS_FILE: /workspace/SYSTEM.md
      AGENT_START_PAUSED: "1"
      LLM_OAUTH_BIND: 0.0.0.0
    ports:
      - "3080:3000"
      - "127.0.0.1:1456:1456"
    volumes:
      - work:/workspace
      - stack:/home/tama/.stack
      - auth:/root/.config/agent-one
      - shared:/shared
      - ./SYSTEM.md:/workspace/SYSTEM.md:ro
      - ./AGENTS.md:/workspace/AGENTS.md:ro
    networks:
      - default
      - progenitor_network

  agent-two:
    build: .
    image: local/agent-one:haskell
    container_name: agent-two
    command: ["--a2a"]
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    env_file: .env
    environment:
      INSTRUCTIONS_FILE: /workspace/SYSTEM.md
      AGENT_START_PAUSED: "1"
      LLM_OAUTH_BIND: 0.0.0.0
      LLM_OAUTH_PORT: "1457"
    ports:
      - "127.0.0.1:1457:1457"
    volumes:
      - work-two:/workspace
      - stack:/home/tama/.stack
      - auth:/root/.config/agent-one
      - shared:/shared
      - ./SYSTEM.md:/workspace/SYSTEM.md:ro
      - ./AGENTS.md:/workspace/AGENTS.md:ro
    networks:
      - default
      - progenitor_network

volumes:
  work:
    name: agent-one-work
  work-two:
    name: agent-two-work
  stack:
    name: agent-one-stack
  auth:
    name: agent-one-auth
  # Exchange volume shared with Progenitor (mounted there at /shared too).
  shared:
    name: progenitor-shared
    external: true

networks:
  # Progenitor reaches the agents over A2A at http://agent-one:8080 / agent-two:8080.
  progenitor_network:
    external: true
